<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Themed AR Exhibit</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- 2. AR.js: Camera + marker tracking -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    #status-banner {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 20px;
      background-color: rgba(220, 53, 69, 0.85); /* Red when searching */
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: bold;
      border-radius: 5px;
      z-index: 999;
      text-align: center;
      transition: background-color 0.3s ease;
    }
  </style>

  <script>
    AFRAME.registerComponent('color-change', {
      init: function () {
        var colors = ['#FF5733', '#33FF57', '#3357FF', '#F39C12', '#9B59B6'];
        var colorIdx = 0;
        this.el.addEventListener('click', () => {
          colorIdx = (colorIdx + 1) % colors.length;
          this.el.setAttribute('material', 'color', colors[colorIdx]);
        });
      }
    });

    AFRAME.registerComponent('tap-grow', {
      init: function () {
        var isGrown = false;
        this.el.addEventListener('click', () => {
          isGrown = !isGrown;
          if (isGrown) {
            this.el.setAttribute('scale', '1.5 1.5 1.5');
          } else {
            this.el.setAttribute('scale', '1 1 1');
          }
        });
      }
    });

    AFRAME.registerComponent('marker-listener', {
      init: function () {
        var banner = document.getElementById('status-banner');
        
        this.el.addEventListener('markerFound', function () {
          banner.textContent = 'Marker Found!';
          banner.style.backgroundColor = 'rgba(40, 167, 69, 0.85)'; // Green
        });

        this.el.addEventListener('markerLost', function () {
          banner.textContent = 'Scanning for Hiro Marker...';
          banner.style.backgroundColor = 'rgba(220, 53, 69, 0.85)'; // Red
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  <div id="status-banner">Scanning for Hiro Marker...</div>

  <a-scene 
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-assets>
      <a-asset-item id="custom-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Lantern/glTF-Binary/Lantern.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-listener>
     
      <a-box 
        class="clickable"
        tap-grow
        position="-0.8 0.5 -0.5" 
        scale="1 1 1"
        material="color: #4CC3D9;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
      </a-box>

      <a-sphere 
        class="clickable"
        color-change
        position="0.8 0.5 -0.5" 
        radius="0.4" 
        material="color: #EF2D5E;">
      </a-sphere>

      <a-cylinder 
        position="0 0.5 0.8" 
        radius="0.3" 
        height="0.6" 
        material="color: #FFC65D;"
        animation="property: position; to: 0 1.0 0.8; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
      </a-cylinder>

      <a-entity 
        gltf-model="#custom-model" 
        position="0 0 -0.2" 
        scale="0.08 0.08 0.08">
      </a-entity>

      <a-text 
        value="Mini Exhibit" 
        position="0 1.5 -0.5" 
        align="center" 
        scale="1.5 1.5 1.5" 
        color="#FFFFFF">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
